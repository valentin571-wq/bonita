<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Bonita & Sheikh - Meniu Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-luxury { font-family: 'Cormorant Garamond', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-stone-200 min-h-screen pb-24 selection:bg-amber-400 selection:text-black">
    
    <!-- MODAL PENTRU MĂRIRE IMAGINE ȘI DETALII NUTRIȚIONALE -->
    <div id="modal-imagine" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4" onclick="inchideModal()">
        <div class="relative bg-zinc-900 p-5 rounded-2xl border border-stone-800 shadow-2xl max-w-sm w-full max-h-[80vh] overflow-y-auto my-auto" onclick="event.stopPropagation()">
            <button onclick="inchideModal()" class="absolute top-3 right-3 bg-amber-400 text-zinc-950 w-7 h-7 rounded-full flex items-center justify-center font-bold text-sm shadow-lg hover:bg-amber-300 transition-colors z-10">✕</button>
            
            <img id="imagine-zoom" src="" alt="Produs" class="w-full h-64 object-cover rounded-xl mb-4">
            
            <div class="flex justify-between items-baseline gap-2 mb-2">
                <h3 id="modal-titlu" class="text-2xl font-luxury font-medium text-stone-100"></h3>
                <span id="modal-pret" class="text-xl font-luxury font-semibold text-amber-400 whitespace-nowrap"></span>
            </div>

            <div id="modal-nutritie-container" class="hidden mt-4 pt-4 border-t border-stone-800">
                <h4 class="text-xs uppercase tracking-widest text-amber-400 font-medium mb-2" data-ro="Valori Nutriționale & Alergeni" data-en="Nutritional Info & Allergens">Valori Nutriționale & Alergeni</h4>
                <p id="modal-nutritie-text" class="text-xs text-stone-300 font-light leading-relaxed whitespace-pre-line bg-zinc-950/60 p-3 rounded-lg border border-stone-800/80"></p>
            </div>
        </div>
    </div>

    <!-- BUTON SCHIMBARE LIMBA -->
    <div class="fixed bottom-8 right-8 z-50">
        <button id="btn-limba" onclick="comutaLimba()" class="bg-stone-900/80 backdrop-blur-md hover:bg-stone-800 text-stone-300 hover:text-white border border-stone-800 rounded-full px-5 py-3 flex items-center gap-2 text-xs tracking-widest uppercase transition-all duration-300 shadow-2xl active:scale-95">
            <span id="text-limba-buton">English</span>
        </button>
    </div>

    <!-- HEADER CU LOGO -->
    <header class="relative h-[45vh] flex flex-col justify-center items-center text-center px-4 bg-cover bg-center" style="background-image: linear-gradient(to bottom, rgba(9, 9, 11, 0.4), rgba(9, 9, 11, 1)), url('https://i.ibb.co/LX5VhkJ6/997-1521x649.webp');">
        
        <!-- BUTON APEL LUXURY EXTINS PERMANENT -->
        <div class="absolute top-6 right-6 z-30">
            <a href="tel:+40371111555" class="flex items-center gap-2.5 bg-zinc-950/60 backdrop-blur-md border border-amber-400/40 py-2 px-4 rounded-full text-amber-400 shadow-lg shadow-black/30 transition-all duration-300 hover:border-amber-400 hover:bg-zinc-950/80">
                <span class="text-[10px] uppercase tracking-[0.2em] font-medium text-stone-100 whitespace-nowrap">
                    <span class="md:hidden" data-ro="Comandă" data-en="Call">Comandă </span>
                    <span class="hidden md:inline" data-ro="Comandă" data-en="Call Now">Comandă </span>
                </span>
                
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5 shrink-0 text-amber-400">
                    <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 0 1 3-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 0 1-.694 1.865l-1.785 1.34a10.584 10.584 0 0 0 5.167 5.167l1.34-1.785a1.875 1.875 0 0 1 1.865-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 0 1-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5Z" clip-rule="evenodd" />
                </svg>
            </a>
        </div>

        <div class="max-w-3xl">
            <h1 class="flex justify-center">
                <img 
                    src="https://i.ibb.co/DfFy0J04/file-000000008f44820aaa5811b48f7d9c17.webp" 
                    alt="Pizza Bonita" 
                    class="w-80 md:w-80 lg:w-96 h-auto object-contain" 
                />
            </h1>

            <div class="w-12 h-[1px] bg-amber-400/50 mx-auto my-4"></div>

            <div class="flex flex-wrap items-center justify-center gap-3 text-stone-400">
                <span class="flex items-center gap-1.5 text-[10px] md:text-xs tracking-[0.15em] text-stone-300 font-light uppercase">
                    <svg 
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.3"
                        class="w-3.5 h-3.5 text-amber-400/80 shrink-0">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 21c3.8-4.2 6-7.5 6-11a6 6 0 1 0-12 0c0 3.5 2.2 6.8 6 11Z" />
                        <circle cx="12" cy="10" r="1.8" />
                    </svg>
                    <span id="hero-subtitlu" data-ro="STRIP MALL PIPERA" data-en="STRIP MALL PIPERA">
                        STRIP MALL PIPERA
                    </span>
                </span>

                <span class="w-1 h-1 rounded-full bg-amber-400/60"></span>

                <span class="flex items-center gap-1.5 text-[10px] md:text-xs tracking-[0.15em] text-stone-300 font-light uppercase">
                    <svg 
                        xmlns="http://www.w3.org/2000/svg" 
                        viewBox="0 0 24 24" 
                        fill="none" 
                        stroke="currentColor" 
                        stroke-width="1.4" 
                        class="w-3.5 h-3.5 text-amber-400/80">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path stroke-linecap="round" d="M12 7v5l3 2"></path>
                    </svg>
                    <span>11:00 — 22:00</span>
                </span>
            </div>
        </div>
    </header>

    <!-- CONTAINER UNIC STICKY -->
    <div class="sticky top-0 z-40 w-full">
        <!-- 1. BANNER HAPPY HOUR -->
        <div id="banner-oferta" class="hidden bg-stone-900 text-amber-400 text-xs uppercase tracking-widest py-3 px-4 text-center border-b border-amber-500/20 backdrop-blur-md bg-stone-900/90 transition-all duration-300">
            <p id="text-oferta" class="font-medium opacity-90"></p>
        </div>

        <!-- 2. BARA DE SELECȚIE PRINCIPALĂ: MÂNCARE / BĂUTURI (STILIZATĂ LUXURY & MINIMALIST) -->
        <div class="bg-zinc-950/95 backdrop-blur-xl py-3 border-b border-stone-900/80">
            <div class="max-w-xs sm:max-w-sm mx-auto px-4 flex justify-center items-center gap-2 p-1 bg-zinc-900/70 border border-stone-800/80 rounded-full shadow-inner">
                <button id="btn-tip-mancare" onclick="schimbaTipMeniu('mancare')" 
                        class="flex-1 py-2 px-5 rounded-full font-luxury text-sm font-medium uppercase tracking-[0.25em] transition-all duration-500 border border-amber-400/80 bg-gradient-to-r from-amber-400 via-amber-300 to-amber-500 text-zinc-950 shadow-lg shadow-amber-500/20">
                    <span data-ro="Mâncare" data-en="Food">Mâncare</span>
                </button>
                <button id="btn-tip-bautura" onclick="schimbaTipMeniu('bautura')" 
                        class="flex-1 py-2 px-5 rounded-full font-luxury text-sm font-medium uppercase tracking-[0.25em] transition-all duration-500 border border-transparent bg-transparent text-stone-400 hover:text-amber-200 hover:border-amber-400/30">
                    <span data-ro="Băuturi" data-en="Drinks">Băuturi</span>
                </button>
            </div>
        </div>

        <!-- 3. BARA DE CATEGORII / SWIPE -->
        <div class="bg-zinc-950/80 backdrop-blur-xl pt-3 pb-3 border-b border-stone-900/60">
            <div class="max-w-5xl mx-auto px-6 flex flex-col gap-2">
                <div id="categorii-nav-container" class="flex gap-3 overflow-x-auto pb-2 justify-start snap-x whitespace-nowrap scroll-smooth scrollbar-luxury">
                </div>
                
                <div class="flex justify-center items-center gap-2 md:hidden opacity-40">
                    <span class="text-[11px] text-amber-400">‹</span>
                    <p class="text-[10px] uppercase tracking-[0.25em] text-stone-200 font-light">Swipe | Glisează</p>
                    <span class="text-[11px] text-amber-400">›</span>
                </div>
            </div>
        </div>
    </div>

    <!-- STILUL CSS PENTRU BARA LUXURY DE DESKTOP -->
    <style>
        .scrollbar-luxury::-webkit-scrollbar { display: none; }
        .scrollbar-luxury { -ms-overflow-style: none; scrollbar-width: none; }

        @media (min-width: 768px) {
            .scrollbar-luxury::-webkit-scrollbar { display: block; height: 3px; }
            .scrollbar-luxury::-webkit-scrollbar-track { background: rgba(41, 37, 36, 0.3); border-radius: 10px; }
            .scrollbar-luxury::-webkit-scrollbar-thumb { background: rgba(251, 191, 36, 0.4); border-radius: 10px; transition: background 0.3s ease; }
            .scrollbar-luxury::-webkit-scrollbar-thumb:hover { background: rgba(251, 191, 36, 0.8); }
            .scrollbar-luxury { -ms-overflow-style: auto; scrollbar-width: thin; scrollbar-color: rgba(251, 191, 36, 0.4) rgba(41, 37, 36, 0.3); }
        }
    </style>

    <main class="max-w-5xl mx-auto px-6 mt-12">
        <div id="loading" class="text-center py-24 text-stone-500 text-xs uppercase tracking-widest font-light" data-ro="Experiența culinară se încarcă..." data-en="The culinary experience is loading...">
            Experiența culinară se încarcă...
        </div>

        <div id="meniu-container" class="space-y-24">
        </div>
    </main>

    <script>
        // CONFIGURARE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCtKQbxvo-atNoeTf2x5Je-zCKjy-hTB_I",
            authDomain: "pizza-bonita.firebaseapp.com",
            projectId: "pizza-bonita",
            storageBucket: "pizza-bonita.firebasestorage.app",
            messagingSenderId: "110222387691",
            appId: "1:110222387691:web:71dd501cb44d56b8a011ae"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let categoriiGlobale = [];
        let setariOferta = null;
        let limbaCurenta = 'ro';
        let tipMeniuCurent = 'mancare'; // Default: Mâncare

        let dictionarCategorii = {};

        // ÎNCĂRCĂM TRADUCERILE DIN TRADUCERI.JSON
        fetch('https://valentin571-wq.github.io/bonita/traduceri.json')
            .then(response => response.json())
            .then(data => {
                dictionarCategorii = data;
                if (categoriiGlobale.length > 0) {
                    randeazaMeniu();
                }
            })
            .catch(err => console.error("Eroare la încărcarea traducerilor:", err));

        function traduceNumeCategorie(nume) {
            if (limbaCurenta === 'ro') return nume;
            let curat = nume.toLowerCase().trim();
            return dictionarCategorii[curat] || nume;
        }

        function comutaLimba() {
            limbaCurenta = (limbaCurenta === 'ro') ? 'en' : 'ro';
            document.getElementById('text-limba-buton').innerText = (limbaCurenta === 'ro') ? 'English' : 'Română';
            
            document.querySelectorAll('[data-ro]').forEach(el => {
                el.innerText = el.getAttribute(`data-${limbaCurenta}`);
            });

            verificaSiAfiseazaOferta();
            randeazaMeniu();
        }

        function schimbaTipMeniu(tip) {
            tipMeniuCurent = tip;
            
            const btnMancare = document.getElementById('btn-tip-mancare');
            const btnBautura = document.getElementById('btn-tip-bautura');

            if (tip === 'mancare') {
                btnMancare.className = "flex-1 py-2 px-5 rounded-full font-luxury text-sm font-medium uppercase tracking-[0.25em] transition-all duration-500 border border-amber-400/80 bg-gradient-to-r from-amber-400 via-amber-300 to-amber-500 text-zinc-950 shadow-lg shadow-amber-500/20";
                btnBautura.className = "flex-1 py-2 px-5 rounded-full font-luxury text-sm font-medium uppercase tracking-[0.25em] transition-all duration-500 border border-transparent bg-transparent text-stone-400 hover:text-amber-200 hover:border-amber-400/30";
            } else {
                btnBautura.className = "flex-1 py-2 px-5 rounded-full font-luxury text-sm font-medium uppercase tracking-[0.25em] transition-all duration-500 border border-amber-400/80 bg-gradient-to-r from-amber-400 via-amber-300 to-amber-500 text-zinc-950 shadow-lg shadow-amber-500/20";
                btnMancare.className = "flex-1 py-2 px-5 rounded-full font-luxury text-sm font-medium uppercase tracking-[0.25em] transition-all duration-500 border border-transparent bg-transparent text-stone-400 hover:text-amber-200 hover:border-amber-400/30";
            }

            randeazaMeniu();
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        // Determină dacă o categorie este Băutură sau Mâncare
        function esteBautura(categorie) {
            const tipCat = categorie.tip || categorie.tipCategorie;
            if (tipCat === 'bautura') return true;
            if (tipCat === 'mancare') return false;

            const numeLower = (categorie.nume || '').toLowerCase();
            const cuvinteBauturi = ['bauturi', 'băuturi', 'sucuri', 'bere', 'vin', 'vinuri', 'cocktail', 'cocktails', 'coffees', 'cafea', 'răcoritoare', 'racoritoare', 'drinks', 'soft drinks', 'water', 'apa'];
            return cuvinteBauturi.some(cuvant => numeLower.includes(cuvant));
        }

        db.collection("setari").doc("oferta").onSnapshot((doc) => {
            if (doc.exists) {
                setariOferta = doc.data();
                verificaSiAfiseazaOferta();
            }
        });

        function verificaSiAfiseazaOferta() {
            const banner = document.getElementById('banner-oferta');
            const textBanner = document.getElementById('text-oferta');

            if (!setariOferta || !setariOferta.activa) {
                banner.classList.add('hidden');
                return;
            }

            const acum = new Date();
            const oraCurenta = `${String(acum.getHours()).padStart(2, '0')}:${String(acum.getMinutes()).padStart(2, '0')}`;

            if (oraCurenta >= setariOferta.oraInceput && oraCurenta <= setariOferta.oraSfarsit) {
                let textInLimba = setariOferta.text;
                const prefix = limbaCurenta === 'ro' ? 'Exclusiv' : 'Exclusive';
                const valabil = limbaCurenta === 'ro' ? 'Disponibil între' : 'Available between';
                
                textBanner.innerText = `${prefix}: ${textInLimba} — ${valabil} ${setariOferta.oraInceput} - ${setariOferta.oraSfarsit}`;
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }
        }

        db.collection("categorii").orderBy("ordine", "asc").onSnapshot((snapshotCategorii) => {
            categoriiGlobale = snapshotCategorii.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            randeazaMeniu();
        });

        function randeazaMeniu() {
            const container = document.getElementById('meniu-container');
            const navContainer = document.getElementById('categorii-nav-container');
            const loading = document.getElementById('loading');
            
            loading.classList.add('hidden');
            container.innerHTML = "";
            navContainer.innerHTML = "";

            if (categoriiGlobale.length === 0) {
                const mesajGol = limbaCurenta === 'ro'
                    ? 'Meniul nu s-a încărcat. Vă rugăm să reîncărcați pagina.'
                    : 'The menu did not load. Please refresh the page.';
                container.innerHTML = `<p class="text-center text-stone-500 font-light text-sm">${mesajGol}</p>`;
                return;
            }

            // Filtrare categorii în funcție de tipul selectat (Mâncare / Băutură)
            const categoriiFiltrate = categoriiGlobale.filter(cat => {
                const bautura = esteBautura(cat);
                return tipMeniuCurent === 'bautura' ? bautura : !bautura;
            });

            if (categoriiFiltrate.length === 0) {
                const mesajNiciunProdus = limbaCurenta === 'ro'
                    ? 'Nu există categorii în această secțiune.'
                    : 'No categories found in this section.';
                container.innerHTML = `<p class="text-center text-stone-500 font-light text-sm py-12">${mesajNiciunProdus}</p>`;
                return;
            }

            categoriiFiltrate.forEach((categorie, index) => {
                const toatePreparatele = categorie.preparate || [];
                const produseCategorie = toatePreparatele.filter(p => p.disponibil === true);
                
                if (produseCategorie.length === 0) return;

                const numeAfisat = traduceNumeCategorie(categorie.nume);

                // 1. BUTON NAVIGARE LUXURY (Stil galben pentru activ, inactiv transparent/gri)
                const butonNav = document.createElement('button');
                butonNav.id = `nav-btn-${categorie.id}`;
                
                // Setăm inițial primul buton activ (stilat cu galben)
                if (index === 0) {
                    butonNav.className = "nav-item-luxury border border-amber-400/80 bg-amber-400 text-zinc-950 font-semibold shadow-lg shadow-amber-400/10 text-xs uppercase tracking-widest px-5 py-2.5 rounded-full whitespace-nowrap snap-center transition-all duration-300 active:scale-95";
                } else {
                    butonNav.className = "nav-item-luxury bg-stone-900/60 text-stone-400 border border-stone-800 text-xs uppercase tracking-widest font-medium px-5 py-2.5 rounded-full whitespace-nowrap snap-center transition-all duration-300 active:scale-95 hover:text-stone-200";
                }

                butonNav.innerText = numeAfisat;
                butonNav.onclick = () => {
                    document.getElementById(`cat-${categorie.id}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
                };
                navContainer.appendChild(butonNav);

                // 2. CONȚINUT CATEGORIE
                const sectiune = document.createElement('section');
                sectiune.id = `cat-${categorie.id}`;
                sectiune.className = "scroll-mt-36 sectiune-meniu-luxury";
                
                let htmlSectiune = `
                    <div class="flex flex-col items-center mb-12 text-center">
                        <h2 class="text-3xl md:text-4xl font-luxury font-light text-stone-100 tracking-wide capitalize">
                            ${numeAfisat}
                        </h2>
                        <div class="w-8 h-[1px] bg-amber-400/30 mt-3"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10">
                `;

                produseCategorie.forEach(produs => {
                    let titluAfisat = produs.titlu;
                    let descriereAfisata = produs.descriere;

                    if (limbaCurenta === 'en') {
                        const cheieTitlu = produs.titlu ? produs.titlu.toLowerCase().trim() : "";
                        const cheieDescriere = produs.descriere ? produs.descriere.toLowerCase().trim() : "";

                        titluAfisat = dictionarCategorii[cheieTitlu] || produs.titlu;
                        descriereAfisata = dictionarCategorii[cheieDescriere] || produs.descriere;
                    }

                    htmlSectiune += `
                        <div class="group flex items-start gap-5 bg-transparent pb-6 border-b border-stone-900/60 hover:border-stone-800 transition-colors duration-300">
                            <div class="w-24 h-24 sm:w-28 sm:h-28 shrink-0 overflow-hidden rounded-lg bg-stone-900">
                                <img src="${produs.imagineUrl || 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300'}" 
                                     alt="${titluAfisat}" 
                                     onclick="deschideModal('${produs.id}')"
                                     class="w-full h-full object-cover grayscale-[20%] group-hover:grayscale-0 group-hover:scale-105 transition-all duration-500 cursor-pointer">
                            </div>
                            <div class="flex flex-col justify-between flex-1 min-h-[96px] sm:min-h-[112px]">
                                <div>
                                    <div class="flex justify-between items-baseline gap-4">
                                        <div class="flex items-center gap-2">
                                            <h3 class="text-lg sm:text-xl font-luxury font-medium text-stone-100 group-hover:text-amber-400/90 transition-colors duration-300 leading-tight">${titluAfisat}</h3>
                                        </div>
                                        <span class="text-xl sm:text-2xl font-luxury font-semibold text-amber-400 whitespace-nowrap">${produs.pret} <span class="text-xs uppercase font-sans tracking-widest text-stone-500 align-middle ml-0.5">Lei</span></span>
                                    </div>
                                    <p class="text-stone-400 text-xs sm:text-sm font-light mt-2 leading-relaxed tracking-wide pr-2">${descriereAfisata}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });

                htmlSectiune += `</div>`;
                sectiune.innerHTML = htmlSectiune;
                container.appendChild(sectiune);
            });

            creeazaScrollspy();
        }

        function creeazaScrollspy() {
            const sectiuni = document.querySelectorAll('.sectiune-meniu-luxury');
            const navContainer = document.getElementById('categorii-nav-container');

            window.addEventListener('scroll', () => {
                let curentId = "";
                
                sectiuni.forEach(sectiune => {
                    const sectiuneTop = sectiune.offsetTop;
                    if (window.pageYOffset >= sectiuneTop - 180) {
                        curentId = sectiune.getAttribute('id').replace('cat-', '');
                    }
                });

                document.querySelectorAll('.nav-item-luxury').forEach(buton => {
                    if (buton.id === `nav-btn-${curentId}`) {
                        // Stil Buton Selectat (Galben plin ca sus)
                        buton.className = "nav-item-luxury border border-amber-400/80 bg-amber-400 text-zinc-950 font-semibold shadow-lg shadow-amber-400/10 text-xs uppercase tracking-widest px-5 py-2.5 rounded-full whitespace-nowrap snap-center transition-all duration-300 active:scale-95";
                        
                        navContainer.scrollTo({
                            left: buton.offsetLeft - navContainer.offsetWidth / 2 + buton.offsetWidth / 2,
                            behavior: 'smooth'
                        });
                    } else {
                        // Stil Buton Neselectat (Întunecat/Gri)
                        buton.className = "nav-item-luxury bg-stone-900/60 text-stone-400 border border-stone-800 text-xs uppercase tracking-widest font-medium px-5 py-2.5 rounded-full whitespace-nowrap snap-center transition-all duration-300 active:scale-95 hover:text-stone-200";
                    }
                });
            });
        }

        function deschideModal(idProdus) {
            let produsGasit = null;

            for (const cat of categoriiGlobale) {
                if (cat.preparate) {
                    const p = cat.preparate.find(item => item.id === idProdus);
                    if (p) {
                        produsGasit = p;
                        break;
                    }
                }
            }

            if (!produsGasit) return;

            const modal = document.getElementById('modal-imagine');
            const img = document.getElementById('imagine-zoom');
            const elTitlu = document.getElementById('modal-titlu');
            const elPret = document.getElementById('modal-pret');
            const containerNutritie = document.getElementById('modal-nutritie-container');
            const elTextNutritie = document.getElementById('modal-nutritie-text');

            img.src = produsGasit.imagineUrl || 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300';
            
            let titluAfisat = produsGasit.titlu;
            if (limbaCurenta === 'en' && produsGasit.titlu) {
                const cheie = produsGasit.titlu.toLowerCase().trim();
                titluAfisat = dictionarCategorii[cheie] || produsGasit.titlu;
            }
            
            elTitlu.innerText = titluAfisat || '';
            elPret.innerText = produsGasit.pret ? `${produsGasit.pret} Lei` : '';

            if (produsGasit.nutritie && produsGasit.nutritie.trim() !== '') {
                elTextNutritie.innerText = produsGasit.nutritie;
                containerNutritie.classList.remove('hidden');
            } else {
                containerNutritie.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function inchideModal() {
            const modal = document.getElementById('modal-imagine');
            modal.classList.add('hidden');
            document.body.style.overflow = '';
        }
    </script>
