        function traduceNumeCategorie(nume) {
            if (limbaCurenta === 'ro') return nume;
            let curat = nume.toLowerCase().trim();
            return dictionarCategorii[curat] || nume;
        }

        function comutaLimba() {
            limbaCurenta = (limbaCurenta === 'ro') ? 'en' : 'ro';
            document.getElementById('text-limba-buton').innerText = (limbaCurenta === 'ro') ? 'English' : 'Română';
            
            document.querySelectorAll('[data-ro]').forEach(el => {
                el.innerText = el.getAttribute(`data-${limbaCurenta}`);
            });

            verificaSiAfiseazaOferta();
            randeazaMeniu();
        }

        db.collection("setari").doc("oferta").onSnapshot((doc) => {
            if (doc.exists) {
                setariOferta = doc.data();
                verificaSiAfiseazaOferta();
            }
        });

        function verificaSiAfiseazaOferta() {
            const banner = document.getElementById('banner-oferta');
            const textBanner = document.getElementById('text-oferta');

            if (!setariOferta || !setariOferta.activa) {
                banner.classList.add('hidden');
                return;
            }

            const acum = new Date();
            const oraCurenta = `${String(acum.getHours()).padStart(2, '0')}:${String(acum.getMinutes()).padStart(2, '0')}`;

            if (oraCurenta >= setariOferta.oraInceput && oraCurenta <= setariOferta.oraSfarsit) {
                let textInLimba = setariOferta.text;
                const prefix = limbaCurenta === 'ro' ? 'Exclusiv' : 'Exclusive';
                const valabil = limbaCurenta === 'ro' ? 'Disponibil între' : 'Available between';
                
                textBanner.innerText = `${prefix}: ${textInLimba} — ${valabil} ${setariOferta.oraInceput} - ${setariOferta.oraSfarsit}`;
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }
        }

        // OPTIMIZARE CRUCIALĂ: Încărcăm DOAR colecția categorii (preparatele se află acum în array-ul "preparate" din fiecare categorie)
        db.collection("categorii").orderBy("ordine", "asc").onSnapshot((snapshotCategorii) => {
            categoriiGlobale = snapshotCategorii.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            randeazaMeniu();
        });

      
        function randeazaMeniu() {
    const container = document.getElementById('meniu-container');
    const navContainer = document.getElementById('categorii-nav-container');
    const loading = document.getElementById('loading');
    
    loading.classList.add('hidden');
    container.innerHTML = "";
    navContainer.innerHTML = "";

    if (categoriiGlobale.length === 0) {
        const mesajGol = limbaCurenta === 'ro' ? 'Meniul este indisponibil momentan.' : 'The menu is currently unavailable.';
        container.innerHTML = `<p class="text-center text-stone-500 font-light text-sm">${mesajGol}</p>`;
        return;
    }

    categoriiGlobale.forEach(categorie => {
        const toatePreparatele = categorie.preparate || [];
        const produseCategorie = toatePreparatele.filter(p => p.disponibil === true);
        
        if (produseCategorie.length === 0) return;

        const numeAfisat = traduceNumeCategorie(categorie.nume);

        // 1. BUTON NAVIGARE LUXURY
        const butonNav = document.createElement('button');
        butonNav.id = `nav-btn-${categorie.id}`;
        butonNav.className = "nav-item-luxury bg-transparent text-stone-400 border border-transparent text-xs uppercase tracking-widest font-medium px-5 py-2.5 rounded-full whitespace-nowrap snap-center transition-all duration-300 active:scale-95";
        butonNav.innerText = numeAfisat;
        butonNav.onclick = () => {
            document.getElementById(`cat-${categorie.id}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        navContainer.appendChild(butonNav);

        // 2. CONȚINUT CATEGORIE
        const sectiune = document.createElement('section');
        sectiune.id = `cat-${categorie.id}`;
        sectiune.className = "scroll-mt-28 sectiune-meniu-luxury";
        
        let htmlSectiune = `
            <div class="flex flex-col items-center mb-12 text-center">
                <h2 class="text-3xl md:text-4xl font-luxury font-light text-stone-100 tracking-wide capitalize">
                    ${numeAfisat}
                </h2>
                <div class="w-8 h-[1px] bg-amber-400/30 mt-3"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10">
        `;

        produseCategorie.forEach(produs => {
            // Logica de traducere pentru titlu și descriere produs
            let titluAfisat = produs.titlu;
            let descriereAfisata = produs.descriere;

            if (limbaCurenta === 'en') {
                const cheieTitlu = produs.titlu ? produs.titlu.toLowerCase().trim() : "";
                const cheieDescriere = produs.descriere ? produs.descriere.toLowerCase().trim() : "";

                titluAfisat = dictionarCategorii[cheieTitlu] || produs.titlu;
                descriereAfisata = dictionarCategorii[cheieDescriere] || produs.descriere;
            }

            htmlSectiune += `
                <div class="group flex items-start gap-5 bg-transparent pb-6 border-b border-stone-900/60 hover:border-stone-800 transition-colors duration-300">
                    <div class="w-24 h-24 sm:w-28 sm:h-28 shrink-0 overflow-hidden rounded-lg bg-stone-900">
                        <img src="${produs.imagineUrl || 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300'}" 
                             alt="${titluAfisat}" 
                             class="w-full h-full object-cover grayscale-[20%] group-hover:grayscale-0 group-hover:scale-105 transition-all duration-500">
                    </div>
                    <div class="flex flex-col justify-between flex-1 min-h-[96px] sm:min-h-[112px]">
                        <div>
                            <div class="flex justify-between items-baseline gap-4">
                                <h3 class="text-lg sm:text-xl font-luxury font-medium text-stone-100 group-hover:text-amber-400/90 transition-colors duration-300 leading-tight">${titluAfisat}</h3>
                               <span class="text-xl sm:text-2xl font-luxury font-semibold text-amber-400 whitespace-nowrap">${produs.pret} <span class="text-xs uppercase font-sans tracking-widest text-stone-500 align-middle ml-0.5">RON</span></span>
                            </div>
                            <p class="text-stone-400 text-xs sm:text-sm font-light mt-2 leading-relaxed tracking-wide pr-2">${descriereAfisata}</p>
                        </div>
                    </div>
                </div>
            `;
        });

        htmlSectiune += `</div>`;
        sectiune.innerHTML = htmlSectiune;
        container.appendChild(sectiune);
    });

    creeazaScrollspy();
}

        function creeazaScrollspy() {
            const sectiuni = document.querySelectorAll('.sectiune-meniu-luxury');
            const navContainer = document.getElementById('categorii-nav-container');

            window.addEventListener('scroll', () => {
                let curentId = "";
                
                sectiuni.forEach(sectiune => {
                    const sectiuneTop = sectiune.offsetTop;
                    if (window.pageYOffset >= sectiuneTop - 160) {
                        curentId = sectiune.getAttribute('id').replace('cat-', '');
                    }
                });

                document.querySelectorAll('.nav-item-luxury').forEach(buton => {
                    if (buton.id === `nav-btn-${curentId}`) {
                        buton.classList.add('text-stone-100', 'bg-stone-900', 'border-stone-800');
                        buton.classList.remove('text-stone-400', 'bg-transparent', 'border-transparent');
                        
                        navContainer.scrollTo({
                            left: buton.offsetLeft - navContainer.offsetWidth / 2 + buton.offsetWidth / 2,
                            behavior: 'smooth'
                        });
                    } else {
                        buton.classList.remove('text-stone-100', 'bg-stone-900', 'border-stone-800');
                        buton.classList.add('text-stone-400', 'bg-transparent', 'border-transparent');
                    }
                });
            });
        }
    </script>
